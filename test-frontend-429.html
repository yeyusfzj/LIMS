<!DOCTYPE html>
<html>
<head>
    <title>测试前端429错误处理</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body>
    <h1>测试前端429错误处理</h1>
    <button onclick="testLogin()">触发登录限流</button>
    <div id="result"></div>

    <script>
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '开始测试...';
            
            try {
                // 发送21次登录请求以触发限流
                for (let i = 0; i < 21; i++) {
                    try {
                        await axios.post('http://localhost:3000/api/auth/login', {
                            username: 'testuser',
                            password: 'wrongpassword'
                        });
                    } catch (error) {
                        if (i === 20) {
                            // 第21次请求，应该是429错误
                            console.log('第21次请求错误:', error);
                            console.log('错误响应:', error.response);
                            console.log('错误状态码:', error.response?.status);
                            
                            if (error.response?.status === 429) {
                                resultDiv.innerHTML = `
                                    <h2>✅ 成功触发429限流</h2>
                                    <p><strong>状态码:</strong> ${error.response.status}</p>
                                    <p><strong>Retry-After:</strong> ${error.response.headers['retry-after']}</p>
                                    <p><strong>错误消息:</strong> ${error.response.data.error.message}</p>
                                    <p><strong>等待时间:</strong> ${error.response.data.error.retryAfter}秒</p>
                                    <p><strong>建议:</strong> ${error.response.data.error.suggestion}</p>
                                `;
                            } else {
                                resultDiv.innerHTML = `❌ 未触发429限流，状态码: ${error.response?.status}`;
                            }
                        }
                    }
                }
            } catch (error) {
                resultDiv.innerHTML = `测试失败: ${error.message}`;
            }
        }
    </script>
</body>
</html>
