<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS 测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            border-color: #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>CORS 测试页面</h1>
    <p>测试前端是否可以访问后端 API</p>

    <div class="test-section">
        <h2>测试 1: 健康检查 (无需认证)</h2>
        <button onclick="testHealth()">测试健康检查</button>
        <div id="health-result"></div>
    </div>

    <div class="test-section">
        <h2>测试 2: 工作流 API (需要认证)</h2>
        <button onclick="testWorkflows()">测试工作流 API</button>
        <div id="workflows-result"></div>
    </div>

    <div class="test-section">
        <h2>测试 3: 审核任务 API (需要认证)</h2>
        <button onclick="testAudits()">测试审核任务 API</button>
        <div id="audits-result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8001';

        async function testHealth() {
            const resultDiv = document.getElementById('health-result');
            resultDiv.innerHTML = '<p>测试中...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/health`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <div class="success">
                        <h3>✅ 成功</h3>
                        <p>状态码: ${response.status}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ 失败</h3>
                        <p>错误: ${error.message}</p>
                        <pre>${error.stack}</pre>
                    </div>
                `;
            }
        }

        async function testWorkflows() {
            const resultDiv = document.getElementById('workflows-result');
            resultDiv.innerHTML = '<p>测试中...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/api/v1/workflows`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.status === 401) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ CORS 正常（需要认证）</h3>
                            <p>状态码: ${response.status}</p>
                            <p>说明: API 需要认证，但 CORS 配置正确</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ 成功</h3>
                            <p>状态码: ${response.status}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ 失败</h3>
                        <p>错误: ${error.message}</p>
                        <p>这可能是 CORS 问题</p>
                        <pre>${error.stack}</pre>
                    </div>
                `;
            }
        }

        async function testAudits() {
            const resultDiv = document.getElementById('audits-result');
            resultDiv.innerHTML = '<p>测试中...</p>';
            
            try {
                const response = await fetch(`${API_BASE}/api/v1/audits`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.status === 401) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ CORS 正常（需要认证）</h3>
                            <p>状态码: ${response.status}</p>
                            <p>说明: API 需要认证，但 CORS 配置正确</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ 成功</h3>
                            <p>状态码: ${response.status}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ 失败</h3>
                        <p>错误: ${error.message}</p>
                        <p>这可能是 CORS 问题</p>
                        <pre>${error.stack}</pre>
                    </div>
                `;
            }
        }

        // 页面加载时自动测试健康检查
        window.onload = function() {
            console.log('CORS 测试页面已加载');
            console.log('API 基础地址:', API_BASE);
        };
    </script>
</body>
</html>
