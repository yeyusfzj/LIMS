<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>前端样品API测试</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background-color: #f5f5f5;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2 px 4px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      border-bottom: 2px solid #409eff;
      padding-bottom: 10px;
    }
    .test-section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .test-section h3 {
      margin-top: 0;
      color: #409eff;
    }
    button {
      background-color: #409eff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background-color: #66b1ff;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .log {
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 400px;
      overflow-y: auto;
    }
    .success {
      color: #67c23a;
    }
    .error {
      color: #f56c6c;
    }
    .info {
      color: #409eff;
    }
    .warning {
      color: #e6a23c;
    }
    input {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin: 5px;
      width: 200px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>前端样品API测试工具</h1>
    
    <div class="test-section">
      <h3>1. 登录</h3>
      <input type="text" id="username" placeholder="用户名" value="admin">
      <input type="password" id="password" placeholder="密码" value="Admin123!">
      <button onclick="testLogin()">登录</button>
      <div id="loginLog" class="log"></div>
    </div>
    
    <div class="test-section">
      <h3>2. 创建样品</h3>
      <input type="text" id="sampleName" placeholder="样品名称" value="测试样品">
      <input type="text" id="sampleType" placeholder="样品类型" value="水质">
      <button onclick="testCreateSample()" id="createBtn" disabled>创建样品</button>
      <div id="createLog" class="log"></div>
    </div>
    
    <div class="test-section">
      <h3>3. 获取样品列表</h3>
      <button onclick="testGetSamples()" id="listBtn" disabled>获取列表</button>
      <button onclick="testGetSamplesWithFilters()" id="filterBtn" disabled>带筛选获取</button>
      <div id="listLog" class="log"></div>
    </div>
    
    <div class="test-section">
      <h3>4. 完整流程测试</h3>
      <button onclick="testFullFlow()">运行完整测试</button>
      <div id="fullLog" class="log"></div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:3000/api';
    let authToken = '';
    let createdSampleId = '';

    function log(elementId, message, type = 'info') {
      const element = document.getElementById(elementId);
      const timestamp = new Date().toLocaleTimeString();
      const className = type;
      element.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
      element.scrollTop = element.scrollHeight;
    }

    function clearLog(elementId) {
      document.getElementById(elementId).innerHTML = '';
    }

    async function testLogin() {
      clearLog('loginLog');
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      log('loginLog', '开始登录...', 'info');
      
      try {
        const response = await fetch(`${API_BASE_URL}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        log('loginLog', `响应状态: ${response.status}`, 'info');
        log('loginLog', `响应数据: ${JSON.stringify(data, null, 2)}`, 'info');
        
        if (data.success && data.data.accessToken) {
          authToken = data.data.accessToken;
          log('loginLog', '✓ 登录成功！', 'success');
          log('loginLog', `Token: ${authToken.substring(0, 30)}...`, 'success');
          
          // 启用其他按钮
          document.getElementById('createBtn').disabled = false;
          document.getElementById('listBtn').disabled = false;
          document.getElementById('filterBtn').disabled = false;
        } else {
          log('loginLog', '✗ 登录失败', 'error');
        }
      } catch (error) {
        log('loginLog', `✗ 请求失败: ${error.message}`, 'error');
      }
    }

    async function testCreateSample() {
      clearLog('createLog');
      const sampleName = document.getElementById('sampleName').value;
      const sampleType = document.getElementById('sampleType').value;
      
      log('createLog', '开始创建样品...', 'info');
      
      const sampleData = {
        clientName: '测试委托方',
        clientContact: '13800138000',
        sampleName: sampleName + '-' + Date.now(),
        sampleType: sampleType,
        sampleCategory: '测试类别',
        quantity: 500,
        unit: 'ml',
        receivedDate: new Date().toISOString(),
        samplingDate: new Date().toISOString(),
        samplingLocation: '测试地点',
        storageLocation: '实验室A-01',
        priority: 'NORMAL',
        description: '这是一个测试样品'
      };
      
      log('createLog', `发送数据: ${JSON.stringify(sampleData, null, 2)}`, 'info');
      
      try {
        const response = await fetch(`${API_BASE_URL}/samples`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify(sampleData)
        });
        
        const data = await response.json();
        log('createLog', `响应状态: ${response.status}`, 'info');
        log('createLog', `响应数据: ${JSON.stringify(data, null, 2)}`, 'info');
        
        if (data.message === '样品创建成功' && data.data) {
          createdSampleId = data.data.id;
          log('createLog', '✓ 样品创建成功！', 'success');
          log('createLog', `ID: ${data.data.id}`, 'success');
          log('createLog', `条码: ${data.data.barcode}`, 'success');
          log('createLog', `样品编号: ${data.data.sampleNumber}`, 'success');
        } else {
          log('createLog', '✗ 样品创建失败', 'error');
        }
      } catch (error) {
        log('createLog', `✗ 请求失败: ${error.message}`, 'error');
      }
    }

    async function testGetSamples() {
      clearLog('listLog');
      log('listLog', '开始获取样品列表...', 'info');
      
      try {
        const response = await fetch(`${API_BASE_URL}/samples?page=1&pageSize=20`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${authToken}`
          }
        });
        
        const data = await response.json();
        log('listLog', `响应状态: ${response.status}`, 'info');
        
        if (data.message === '查询成功' && data.data) {
          const result = data.data;
          log('listLog', '✓ 获取样品列表成功！', 'success');
          log('listLog', `总数: ${result.total}`, 'success');
          log('listLog', `当前页: ${result.page}`, 'success');
          log('listLog', `每页数量: ${result.pageSize}`, 'success');
          log('listLog', `样品数量: ${result.items.length}`, 'success');
          
          if (result.items.length > 0) {
            log('listLog', '\n前5个样品:', 'info');
            result.items.slice(0, 5).forEach((sample, index) => {
              log('listLog', `${index + 1}. ${sample.barcode} - ${sample.sampleName} (${sample.status})`, 'info');
            });
          }
          
          // 检查刚创建的样品是否在列表中
          if (createdSampleId) {
            const found = result.items.find(s => s.id === createdSampleId);
            if (found) {
              log('listLog', '\n✓✓✓ 刚创建的样品在列表中找到了！', 'success');
            } else {
              log('listLog', '\n✗✗✗ 刚创建的样品未在列表中找到', 'error');
            }
          }
        } else {
          log('listLog', '✗ 获取样品列表失败', 'error');
          log('listLog', JSON.stringify(data, null, 2), 'error');
        }
      } catch (error) {
        log('listLog', `✗ 请求失败: ${error.message}`, 'error');
      }
    }

    async function testGetSamplesWithFilters() {
      clearLog('listLog');
      log('listLog', '开始获取样品列表（带筛选）...', 'info');
      
      try {
        const response = await fetch(`${API_BASE_URL}/samples?page=1&pageSize=20&sampleType=水质`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${authToken}`
          }
        });
        
        const data = await response.json();
        log('listLog', `响应状态: ${response.status}`, 'info');
        
        if (data.message === '查询成功' && data.data) {
          const result = data.data;
          log('listLog', '✓ 获取样品列表成功（筛选：水质）！', 'success');
          log('listLog', `总数: ${result.total}`, 'success');
          log('listLog', `样品数量: ${result.items.length}`, 'success');
        } else {
          log('listLog', '✗ 获取样品列表失败', 'error');
        }
      } catch (error) {
        log('listLog', `✗ 请求失败: ${error.message}`, 'error');
      }
    }

    async function testFullFlow() {
      clearLog('fullLog');
      log('fullLog', '========== 开始完整流程测试 ==========', 'info');
      
      // 1. 登录
      log('fullLog', '\n步骤1: 登录', 'info');
      try {
        const loginResponse = await fetch(`${API_BASE_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const loginData = await loginResponse.json();
        
        if (loginData.success && loginData.data.accessToken) {
          authToken = loginData.data.accessToken;
          log('fullLog', '✓ 登录成功', 'success');
          document.getElementById('createBtn').disabled = false;
          document.getElementById('listBtn').disabled = false;
          document.getElementById('filterBtn').disabled = false;
        } else {
          log('fullLog', '✗ 登录失败', 'error');
          return;
        }
      } catch (error) {
        log('fullLog', `✗ 登录失败: ${error.message}`, 'error');
        return;
      }
      
      // 2. 创建样品
      log('fullLog', '\n步骤2: 创建样品', 'info');
      try {
        const createResponse = await fetch(`${API_BASE_URL}/samples`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({
            clientName: '完整测试委托方',
            clientContact: '13800138000',
            sampleName: '完整测试样品-' + Date.now(),
            sampleType: '水质',
            sampleCategory: '地表水',
            quantity: 500,
            unit: 'ml',
            receivedDate: new Date().toISOString(),
            samplingDate: new Date().toISOString(),
            samplingLocation: '测试地点',
            storageLocation: '实验室A-01',
            priority: 'NORMAL',
            description: '完整流程测试样品'
          })
        });
        const createData = await createResponse.json();
        
        if (createData.message === '样品创建成功' && createData.data) {
          createdSampleId = createData.data.id;
          log('fullLog', '✓ 样品创建成功', 'success');
          log('fullLog', `  条码: ${createData.data.barcode}`, 'success');
        } else {
          log('fullLog', '✗ 样品创建失败', 'error');
          return;
        }
      } catch (error) {
        log('fullLog', `✗ 创建样品失败: ${error.message}`, 'error');
        return;
      }
      
      // 3. 获取列表并验证
      log('fullLog', '\n步骤3: 获取样品列表并验证', 'info');
      try {
        const listResponse = await fetch(`${API_BASE_URL}/samples?page=1&pageSize=20`, {
          method: 'GET',
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const listData = await listResponse.json();
        
        if (listData.message === '查询成功' && listData.data) {
          log('fullLog', `✓ 获取列表成功，总数: ${listData.data.total}`, 'success');
          
          const found = listData.data.items.find(s => s.id === createdSampleId);
          if (found) {
            log('fullLog', '✓✓✓ 新创建的样品在列表中找到了！', 'success');
            log('fullLog', `  条码: ${found.barcode}`, 'success');
            log('fullLog', `  名称: ${found.sampleName}`, 'success');
            log('fullLog', `  状态: ${found.status}`, 'success');
          } else {
            log('fullLog', '✗✗✗ 新创建的样品未在列表中找到', 'error');
          }
        } else {
          log('fullLog', '✗ 获取列表失败', 'error');
        }
      } catch (error) {
        log('fullLog', `✗ 获取列表失败: ${error.message}`, 'error');
      }
      
      log('fullLog', '\n========== 完整流程测试结束 ==========', 'info');
    }
  </script>
</body>
</html>
