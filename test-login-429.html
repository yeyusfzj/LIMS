<!DOCTYPE html>
<html>
<head>
    <title>测试登录429错误</title>
</head>
<body>
    <h1>测试登录429错误处理</h1>
    <button onclick="testLogin()">触发登录请求</button>
    <div id="result"></div>

    <script>
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '发送登录请求...';
            
            try {
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'test',
                        password: 'test'
                    })
                });
                
                const data = await response.json();
                
                if (response.status === 429) {
                    resultDiv.innerHTML = `
                        <h3>429错误响应:</h3>
                        <p>状态码: ${response.status}</p>
                        <p>Retry-After头: ${response.headers.get('retry-after')}</p>
                        <p>错误消息: ${data.error.message}</p>
                        <p>等待时间: ${data.error.retryAfter}秒</p>
                        <p>建议: ${data.error.suggestion}</p>
                    `;
                } else {
                    resultDiv.innerHTML = `响应: ${JSON.stringify(data)}`;
                }
            } catch (error) {
                resultDiv.innerHTML = `错误: ${error.message}`;
            }
        }
    </script>
</body>
</html>
