<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前端样品编辑调试工具</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            border-bottom: 3px solid #409EFF;
            padding-bottom: 10px;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            background: #f9f9f9;
            border-left: 4px solid #409EFF;
        }
        .section h2 {
            margin-top: 0;
            color: #409EFF;
        }
        button {
            background: #409EFF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover {
            background: #66b1ff;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .log {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #3498db;
            padding-left: 10px;
        }
        .log-entry.success {
            border-left-color: #27ae60;
        }
        .log-entry.error {
            border-left-color: #e74c3c;
        }
        .log-entry.warning {
            border-left-color: #f39c12;
        }
        input, select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin: 5px;
            font-size: 14px;
        }
        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.pending {
            background: #fff3cd;
            color: #856404;
        }
        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 前端样品编辑调试工具</h1>
        
        <div class="section">
            <h2>1. 登录</h2>
            <input type="text" id="username" value="admin" placeholder="用户名">
            <input type="password" id="password" value="admin123" placeholder="密码">
            <button onclick="login()">登录</button>
            <span id="loginStatus"></span>
        </div>

        <div class="section">
            <h2>2. 获取样品列表</h2>
            <button onclick="getSamples()" id="getSamplesBtn" disabled>获取样品列表</button>
            <span id="samplesStatus"></span>
            <div id="samplesList"></div>
        </div>

        <div class="section">
            <h2>3. 编辑样品</h2>
            <select id="sampleSelect" disabled>
                <option value="">请先获取样品列表</option>
            </select>
            <input type="text" id="newName" placeholder="新的样品名称">
            <input type="number" id="newQuantity" placeholder="新的数量" value="999">
            <button onclick="editSample()" id="editBtn" disabled>更新样品</button>
            <span id="editStatus"></span>
        </div>

        <div class="section">
            <h2>4. 验证更新</h2>
            <button onclick="verifySample()" id="verifyBtn" disabled>重新获取样品详情</button>
            <span id="verifyStatus"></span>
            <div id="verifyResult"></div>
        </div>

        <div class="section">
            <h2>📋 调试日志</h2>
            <button onclick="clearLog()">清空日志</button>
            <div class="log" id="log"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8000/api/v1';
        let token = '';
        let currentSampleId = '';
        let originalSampleData = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.innerHTML = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}]`, message);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function setStatus(elementId, text, type) {
            const el = document.getElementById(elementId);
            el.innerHTML = `<span class="status ${type}">${text}</span>`;
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            log('🔐 开始登录...', 'info');
            
            try {
                const response = await axios.post(`${API_BASE}/auth/login`, {
                    username,
                    password
                });

                log(`✅ 登录成功: ${JSON.stringify(response.data)}`, 'success');
                
                if (response.data.success && response.data.data.accessToken) {
                    token = response.data.data.accessToken;
                    setStatus('loginStatus', '登录成功', 'success');
                    document.getElementById('getSamplesBtn').disabled = false;
                    log(`🎫 Token已保存: ${token.substring(0, 20)}...`, 'success');
                } else {
                    throw new Error('响应格式不正确');
                }
            } catch (error) {
                log(`❌ 登录失败: ${error.response?.data?.error?.message || error.message}`, 'error');
                setStatus('loginStatus', '登录失败', 'error');
            }
        }

        async function getSamples() {
            log('📋 获取样品列表...', 'info');
            
            try {
                const response = await axios.get(`${API_BASE}/samples`, {
                    headers: { Authorization: `Bearer ${token}` },
                    params: { page: 1, page_size: 10 }
                });

                log(`✅ 获取样品列表成功`, 'success');
                log(`📊 响应数据: ${JSON.stringify(response.data, null, 2)}`, 'info');

                if (response.data.success && response.data.data.items.length > 0) {
                    const samples = response.data.data.items;
                    const select = document.getElementById('sampleSelect');
                    select.innerHTML = samples.map(s => 
                        `<option value="${s.id}">${s.sample_name} (${s.quantity}${s.unit})</option>`
                    ).join('');
                    select.disabled = false;
                    document.getElementById('editBtn').disabled = false;
                    setStatus('samplesStatus', `找到 ${samples.length} 个样品`, 'success');
                    
                    // 显示样品列表
                    const listDiv = document.getElementById('samplesList');
                    listDiv.innerHTML = '<pre>' + JSON.stringify(samples.slice(0, 3), null, 2) + '</pre>';
                } else {
                    throw new Error('没有找到样品');
                }
            } catch (error) {
                log(`❌ 获取样品列表失败: ${error.response?.data?.error?.message || error.message}`, 'error');
                setStatus('samplesStatus', '获取失败', 'error');
            }
        }

        async function editSample() {
            const sampleId = document.getElementById('sampleSelect').value;
            const newName = document.getElementById('newName').value;
            const newQuantity = parseInt(document.getElementById('newQuantity').value);

            if (!sampleId) {
                log('❌ 请选择一个样品', 'error');
                return;
            }

            if (!newName) {
                log('❌ 请输入新的样品名称', 'error');
                return;
            }

            currentSampleId = sampleId;

            log(`💾 开始更新样品 ID: ${sampleId}`, 'info');
            log(`📝 新名称: ${newName}`, 'info');
            log(`📝 新数量: ${newQuantity}`, 'info');

            // 先获取原始数据
            try {
                const getResponse = await axios.get(`${API_BASE}/samples/${sampleId}`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                originalSampleData = getResponse.data.data;
                log(`📊 原始数据: ${JSON.stringify(originalSampleData, null, 2)}`, 'info');
            } catch (error) {
                log(`❌ 获取原始数据失败: ${error.message}`, 'error');
            }

            // 更新样品
            try {
                const updateData = {
                    sample_name: newName,
                    quantity: newQuantity
                };

                log(`📤 发送PATCH请求到: ${API_BASE}/samples/${sampleId}`, 'info');
                log(`📤 请求数据: ${JSON.stringify(updateData, null, 2)}`, 'info');

                const response = await axios.patch(
                    `${API_BASE}/samples/${sampleId}`,
                    updateData,
                    {
                        headers: { Authorization: `Bearer ${token}` }
                    }
                );

                log(`✅ 更新响应: ${JSON.stringify(response.data, null, 2)}`, 'success');

                if (response.data.success) {
                    const updatedSample = response.data.data;
                    log(`📊 更新后的数据:`, 'success');
                    log(`   - ID: ${updatedSample.id}`, 'success');
                    log(`   - 名称: ${updatedSample.sample_name}`, 'success');
                    log(`   - 数量: ${updatedSample.quantity}`, 'success');
                    log(`   - 版本: ${updatedSample.version}`, 'success');
                    log(`   - 更新时间: ${updatedSample.updated_at}`, 'success');

                    // 验证数据是否正确
                    if (updatedSample.sample_name === newName && updatedSample.quantity === newQuantity) {
                        log(`✅✅✅ 验证通过：API返回的数据正确！`, 'success');
                        setStatus('editStatus', '更新成功', 'success');
                        document.getElementById('verifyBtn').disabled = false;
                    } else {
                        log(`❌ 验证失败：API返回的数据不正确`, 'error');
                        log(`   预期名称: ${newName}, 实际: ${updatedSample.sample_name}`, 'error');
                        log(`   预期数量: ${newQuantity}, 实际: ${updatedSample.quantity}`, 'error');
                        setStatus('editStatus', '数据不匹配', 'error');
                    }
                } else {
                    throw new Error('更新失败');
                }
            } catch (error) {
                log(`❌ 更新样品失败: ${error.response?.data?.error?.message || error.message}`, 'error');
                setStatus('editStatus', '更新失败', 'error');
            }
        }

        async function verifySample() {
            if (!currentSampleId) {
                log('❌ 没有当前样品ID', 'error');
                return;
            }

            log(`🔍 重新获取样品详情 ID: ${currentSampleId}`, 'info');

            try {
                const response = await axios.get(`${API_BASE}/samples/${currentSampleId}`, {
                    headers: { Authorization: `Bearer ${token}` }
                });

                log(`✅ 获取详情成功`, 'success');
                log(`📊 当前数据: ${JSON.stringify(response.data.data, null, 2)}`, 'success');

                const currentData = response.data.data;
                const resultDiv = document.getElementById('verifyResult');
                
                resultDiv.innerHTML = `
                    <h3>对比结果：</h3>
                    <table style="width:100%; border-collapse: collapse;">
                        <tr style="background:#f0f0f0;">
                            <th style="padding:8px; border:1px solid #ddd;">字段</th>
                            <th style="padding:8px; border:1px solid #ddd;">原始值</th>
                            <th style="padding:8px; border:1px solid #ddd;">当前值</th>
                            <th style="padding:8px; border:1px solid #ddd;">状态</th>
                        </tr>
                        <tr>
                            <td style="padding:8px; border:1px solid #ddd;">样品名称</td>
                            <td style="padding:8px; border:1px solid #ddd;">${originalSampleData?.sample_name || 'N/A'}</td>
                            <td style="padding:8px; border:1px solid #ddd;">${currentData.sample_name}</td>
                            <td style="padding:8px; border:1px solid #ddd;">${originalSampleData?.sample_name !== currentData.sample_name ? '✅ 已变化' : '❌ 未变化'}</td>
                        </tr>
                        <tr>
                            <td style="padding:8px; border:1px solid #ddd;">数量</td>
                            <td style="padding:8px; border:1px solid #ddd;">${originalSampleData?.quantity || 'N/A'}</td>
                            <td style="padding:8px; border:1px solid #ddd;">${currentData.quantity}</td>
                            <td style="padding:8px; border:1px solid #ddd;">${originalSampleData?.quantity !== currentData.quantity ? '✅ 已变化' : '❌ 未变化'}</td>
                        </tr>
                        <tr>
                            <td style="padding:8px; border:1px solid #ddd;">版本号</td>
                            <td style="padding:8px; border:1px solid #ddd;">${originalSampleData?.version || 'N/A'}</td>
                            <td style="padding:8px; border:1px solid #ddd;">${currentData.version}</td>
                            <td style="padding:8px; border:1px solid #ddd;">${originalSampleData?.version !== currentData.version ? '✅ 已递增' : '❌ 未递增'}</td>
                        </tr>
                    </table>
                `;

                setStatus('verifyStatus', '验证完成', 'success');
            } catch (error) {
                log(`❌ 验证失败: ${error.response?.data?.error?.message || error.message}`, 'error');
                setStatus('verifyStatus', '验证失败', 'error');
            }
        }

        // 页面加载时的提示
        log('🚀 调试工具已就绪', 'success');
        log('📝 请按顺序执行：1.登录 → 2.获取样品 → 3.编辑样品 → 4.验证更新', 'info');
    </script>
</body>
</html>
