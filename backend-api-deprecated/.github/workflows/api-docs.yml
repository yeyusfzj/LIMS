name: API 文档自动生成和发布

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**/*.ts'
      - 'src/config/swagger.ts'
      - 'package.json'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**/*.ts'
      - 'src/config/swagger.ts'

jobs:
  # 验证文档完整性
  validate-docs:
    name: 验证 API 文档
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 安装依赖
        run: npm ci
      
      - name: 生成 Prisma 客户端
        run: npm run prisma:generate
      
      - name: 构建项目
        run: npm run build
      
      - name: 验证 Swagger 配置
        run: node -e "const spec = require('./dist/config/swagger').swaggerSpec; console.log('Swagger 规范验证成功'); console.log('API 端点数量:', Object.keys(spec.paths || {}).length);"
      
      - name: 检查文档覆盖率
        run: |
          node -e "
          const spec = require('./dist/config/swagger').swaggerSpec;
          const paths = spec.paths || {};
          const totalEndpoints = Object.keys(paths).length;
          let documentedEndpoints = 0;
          
          for (const path in paths) {
            for (const method in paths[path]) {
              if (paths[path][method].summary || paths[path][method].description) {
                documentedEndpoints++;
              }
            }
          }
          
          const coverage = totalEndpoints > 0 ? (documentedEndpoints / totalEndpoints * 100).toFixed(2) : 0;
          console.log('文档覆盖率:', coverage + '%');
          console.log('已文档化端点:', documentedEndpoints);
          console.log('总端点数:', totalEndpoints);
          
          if (coverage < 80) {
            console.warn('警告: 文档覆盖率低于 80%');
          }
          "

  # 生成和发布文档
  generate-docs:
    name: 生成 API 文档
    runs-on: ubuntu-latest
    needs: validate-docs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史以便生成版本信息
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 安装依赖
        run: npm ci
      
      - name: 生成 Prisma 客户端
        run: npm run prisma:generate
      
      - name: 构建项目
        run: npm run build
      
      - name: 生成 API 文档
        run: |
          mkdir -p docs/api
          node -e "
          const fs = require('fs');
          const spec = require('./dist/config/swagger').swaggerSpec;
          
          // 添加版本信息
          const version = process.env.GITHUB_SHA ? process.env.GITHUB_SHA.substring(0, 7) : 'local';
          const branch = process.env.GITHUB_REF_NAME || 'unknown';
          const timestamp = new Date().toISOString();
          
          spec.info.version = spec.info.version + '-' + version;
          spec.info['x-build-info'] = {
            commit: process.env.GITHUB_SHA || 'unknown',
            branch: branch,
            buildTime: timestamp,
            buildNumber: process.env.GITHUB_RUN_NUMBER || 'local'
          };
          
          // 保存 JSON 格式
          fs.writeFileSync(
            'docs/api/openapi.json',
            JSON.stringify(spec, null, 2)
          );
          
          // 保存 YAML 格式
          const yaml = require('js-yaml');
          fs.writeFileSync(
            'docs/api/openapi.yaml',
            yaml.dump(spec)
          );
          
          console.log('API 文档生成成功');
          console.log('版本:', spec.info.version);
          console.log('分支:', branch);
          console.log('提交:', version);
          "
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      
      - name: 生成文档变更日志
        run: |
          node scripts/generate-changelog.js
      
      - name: 上传文档制品
        uses: actions/upload-artifact@v4
        with:
          name: api-docs-${{ github.ref_name }}-${{ github.sha }}
          path: |
            docs/api/
            docs/CHANGELOG.md
          retention-days: 90
      
      - name: 提交文档到 gh-pages 分支
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          
          # 创建或切换到 gh-pages 分支
          git fetch origin gh-pages || git checkout --orphan gh-pages
          git checkout gh-pages || git checkout --orphan gh-pages
          
          # 清理工作目录
          git rm -rf . || true
          
          # 复制文档文件
          cp -r docs/api/* .
          
          # 创建索引页面
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>实验室管理系统 API 文档</title>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                max-width: 800px;
                margin: 50px auto;
                padding: 20px;
                line-height: 1.6;
              }
              h1 { color: #333; }
              .links { margin: 30px 0; }
              .links a {
                display: inline-block;
                margin: 10px 10px 10px 0;
                padding: 10px 20px;
                background: #007bff;
                color: white;
                text-decoration: none;
                border-radius: 5px;
              }
              .links a:hover { background: #0056b3; }
              .info { background: #f8f9fa; padding: 15px; border-radius: 5px; margin: 20px 0; }
            </style>
          </head>
          <body>
            <h1>实验室管理系统 API 文档</h1>
            <div class="info">
              <p><strong>版本:</strong> ${{ github.ref_name }}</p>
              <p><strong>构建时间:</strong> $(date -u +"%Y-%m-%d %H:%M:%S UTC")</p>
              <p><strong>提交:</strong> ${{ github.sha }}</p>
            </div>
            <div class="links">
              <a href="openapi.json" target="_blank">OpenAPI JSON</a>
              <a href="openapi.yaml" target="_blank">OpenAPI YAML</a>
              <a href="https://petstore.swagger.io/?url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/openapi.json" target="_blank">在线查看文档</a>
            </div>
            <h2>使用说明</h2>
            <p>您可以通过以下方式使用 API 文档：</p>
            <ul>
              <li>点击上方链接在线查看交互式文档</li>
              <li>下载 JSON 或 YAML 文件导入到 Postman</li>
              <li>使用 OpenAPI Generator 生成客户端 SDK</li>
            </ul>
          </body>
          </html>
          EOF
          
          # 提交并推送
          git add .
          git commit -m "Update API documentation from ${{ github.sha }}" || echo "No changes to commit"
          git push origin gh-pages --force

  # 通知文档更新
  notify:
    name: 通知文档更新
    runs-on: ubuntu-latest
    needs: generate-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 发送通知
        run: |
          echo "API 文档已更新"
          echo "查看地址: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "提交: ${{ github.sha }}"
          echo "分支: ${{ github.ref_name }}"
