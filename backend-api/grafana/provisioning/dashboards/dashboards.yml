# Grafana 仪表板配置

apiVersion: 1

providers:
  - name: 'Laboratory System Dashboards'
    orgId: 1
    folder: 'Laboratory System'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
