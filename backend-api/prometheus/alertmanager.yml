# Alertmanager 配置文件
# 用于管理和路由告警通知

global:
  # SMTP 配置（邮件通知）
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@example.com'
  smtp_auth_username: 'alertmanager@example.com'
  smtp_auth_password: 'password'
  smtp_require_tls: true

# 告警路由配置
route:
  # 默认接收者
  receiver: 'default'
  
  # 分组配置
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s  # 等待时间（收集同组告警）
  group_interval: 10s  # 发送间隔
  repeat_interval: 12h  # 重复发送间隔
  
  # 子路由
  routes:
    # 严重告警立即发送
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 5m
    
    # 数据库告警
    - match:
        component: database
      receiver: 'database-team'
      group_wait: 30s
    
    # API 告警
    - match:
        component: api
      receiver: 'api-team'
      group_wait: 30s
    
    # 系统告警
    - match:
        component: system
      receiver: 'ops-team'
      group_wait: 1m

# 接收者配置
receivers:
  # 默认接收者
  - name: 'default'
    email_configs:
      - to: 'ops@example.com'
        headers:
          Subject: '[Laboratory System] 告警通知'
    webhook_configs:
      - url: 'http://webhook-service:8080/alerts'
        send_resolved: true

  # 严重告警接收者
  - name: 'critical-alerts'
    email_configs:
      - to: 'ops@example.com,manager@example.com'
        headers:
          Subject: '[CRITICAL] Laboratory System 严重告警'
    # 可以添加短信、电话等通知方式
    # webhook_configs:
    #   - url: 'http://sms-service:8080/send'

  # 数据库团队
  - name: 'database-team'
    email_configs:
      - to: 'dba@example.com'
        headers:
          Subject: '[Database] Laboratory System 数据库告警'

  # API 团队
  - name: 'api-team'
    email_configs:
      - to: 'api-team@example.com'
        headers:
          Subject: '[API] Laboratory System API 告警'

  # 运维团队
  - name: 'ops-team'
    email_configs:
      - to: 'ops@example.com'
        headers:
          Subject: '[System] Laboratory System 系统告警'

# 抑制规则（避免告警风暴）
inhibit_rules:
  # 如果服务不可用，抑制其他相关告警
  - source_match:
      severity: 'critical'
      alertname: 'ServiceDown'
    target_match:
      severity: 'warning'
    equal: ['instance', 'job']
  
  # 如果数据库不可用，抑制数据库相关告警
  - source_match:
      alertname: 'DatabaseDown'
    target_match:
      component: 'database'
    equal: ['instance']
  
  # 如果 Redis 不可用，抑制 Redis 相关告警
  - source_match:
      alertname: 'RedisDown'
    target_match:
      component: 'redis'
    equal: ['instance']

# 告警模板
templates:
  - '/etc/alertmanager/templates/*.tmpl'
